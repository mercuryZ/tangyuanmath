<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Four untimed practice questions with answer boxes, a level badge and a progress bar">
  <defs>
    <pattern id="tp-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#F2555A" opacity="0.10"/>
    </pattern>
    <linearGradient id="tp-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2555A"/><stop offset="1" stop-color="#FF8A8E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#FFF7F2"/>
  <rect width="800" height="560" fill="url(#tp-dots)"/>

  <!-- 练习主卡片 -->
  <rect x="60" y="46" width="680" height="468" rx="24" fill="#fff" stroke="#F2555A" stroke-width="6"/>

  <!-- 顶栏：难度徽标 + 进度条 -->
  <rect x="92" y="78" width="88" height="34" rx="17" fill="#FFE9E6"/>
  <text x="136" y="101" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="800" fill="#B02A37">1–10</text>
  <rect x="198" y="85" width="372" height="20" rx="10" fill="#FFE9E6"/>
  <rect x="198" y="85" width="167" height="20" rx="10" fill="url(#tp-fill)"/>

  <!-- 题目卡 1：已答对 -->
  <g>
    <rect x="92" y="140" width="278" height="126" rx="16" fill="#FFF7F2" stroke="#FFDAD4" stroke-width="3"/>
    <circle cx="122" cy="172" r="15" fill="#FFE9E6"/>
    <text x="122" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="800" fill="#D93B47">1</text>
    <text x="148" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="900" fill="#5D3A3A">3 × 4 =</text>
    <rect x="114" y="202" width="164" height="46" rx="10" fill="#fff" stroke="#FFC2CC" stroke-width="3"/>
    <text x="130" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="900" fill="#5D3A3A">12</text>
    <circle cx="312" cy="225" r="15" fill="#F2555A"/>
    <path d="M 305 225 L 310 230 L 320 219" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 题目卡 2：已答对 -->
  <g>
    <rect x="430" y="140" width="278" height="126" rx="16" fill="#FFF7F2" stroke="#FFDAD4" stroke-width="3"/>
    <circle cx="460" cy="172" r="15" fill="#FFE9E6"/>
    <text x="460" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="800" fill="#D93B47">2</text>
    <text x="486" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="900" fill="#5D3A3A">7 × 8 =</text>
    <rect x="452" y="202" width="164" height="46" rx="10" fill="#fff" stroke="#FFC2CC" stroke-width="3"/>
    <text x="468" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="900" fill="#5D3A3A">56</text>
    <circle cx="650" cy="225" r="15" fill="#F2555A"/>
    <path d="M 643 225 L 648 230 L 658 219" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 题目卡 3：待答 -->
  <g>
    <rect x="92" y="286" width="278" height="126" rx="16" fill="#FFF7F2" stroke="#FFDAD4" stroke-width="3"/>
    <circle cx="122" cy="318" r="15" fill="#FFE9E6"/>
    <text x="122" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="800" fill="#D93B47">3</text>
    <text x="148" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="900" fill="#5D3A3A">6 × 9 =</text>
    <rect x="114" y="348" width="164" height="46" rx="10" fill="#fff" stroke="#FFC2CC" stroke-width="3"/>
  </g>

  <!-- 题目卡 4：待答 -->
  <g>
    <rect x="430" y="286" width="278" height="126" rx="16" fill="#FFF7F2" stroke="#FFDAD4" stroke-width="3"/>
    <circle cx="460" cy="318" r="15" fill="#FFE9E6"/>
    <text x="460" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="800" fill="#D93B47">4</text>
    <text x="486" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="900" fill="#5D3A3A">5 × 6 =</text>
    <rect x="452" y="348" width="164" height="46" rx="10" fill="#fff" stroke="#FFC2CC" stroke-width="3"/>
  </g>

  <!-- 检查按钮 -->
  <rect x="280" y="436" width="240" height="52" rx="26" fill="#F2555A"/>
  <path d="M 378 462 L 392 476 L 422 444" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
