<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="A wrong answer of 511 to 23 times 27, followed by a step-by-step hint: 2 times 3 equals 6, 3 times 7 equals 21, answer 621">
  <defs>
    <pattern id="th-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#F2555A" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="800" height="560" fill="#FFF7F2"/>
  <rect width="800" height="560" fill="url(#th-dots)"/>

  <!-- 题目卡片：答错 -->
  <rect x="60" y="46" width="680" height="270" rx="24" fill="#fff" stroke="#F2555A" stroke-width="6"/>
  <text x="110" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="900" fill="#5D3A3A">23 × 27 =</text>
  <rect x="420" y="102" width="210" height="72" rx="14" fill="#fff" stroke="#F2555A" stroke-width="4"/>
  <text x="525" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="38" font-weight="900" fill="#B02A37">511</text>
  <line x1="446" y1="138" x2="604" y2="138" stroke="#B02A37" stroke-width="4" stroke-linecap="round"/>
  <circle cx="662" cy="98" r="22" fill="#B02A37"/>
  <path d="M 653 89 L 671 107 M 671 89 L 653 107" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- 分步提示卡片 -->
  <rect x="60" y="346" width="680" height="168" rx="20" fill="#FFE9E6"/>
  <circle cx="112" cy="430" r="26" fill="#F2555A"/>
  <text x="112" y="441" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="900" fill="#fff">?</text>
  <text x="160" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="800" fill="#B02A37">2 × 3 = 6</text>
  <text x="160" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="800" fill="#B02A37">3 × 7 = 21</text>
  <text x="160" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="900" fill="#D93B47">= 621</text>
</svg>
