# Render Blueprint — Tangyuan Math (M1：Express + SQLite)
# 部署：render.com → New → Blueprint → 选择本仓库，一键创建 Web Service + 持久磁盘。
#
# ⚠️ 本文件必须与线上实况保持一致。当前线上服务（name: tangyuanmath）是手工创建的，
#    Blueprint 同步是「按 name 认领」：一旦你为本仓库创建 Blueprint 或点同步，
#    Render 会把下面的配置应用到那个已存在的服务上。所以这里写的每一项都应等于控制台现值，
#    否则同步会改动生产配置（包括磁盘挂载点，而磁盘上放着唯一的 SQLite 数据）。
#    对齐依据：部署日志（buildCommand 为 `cd server && pnpm install`，说明未设置 rootDir）
#    + 控制台环境变量。
#
# 重要提示：
#   - 磁盘挂载点与 TM_DB_FILE 必须落在同一个目录下，否则数据不会写到持久盘上。
#   - 持久磁盘是付费功能：服务需 Starter 及以上实例（约 $7/月），磁盘约 $0.25/GB/月。
#   - 挂载磁盘会禁用零停机部署（旧实例先停、新实例再起，期间数秒不可用），且无法扩容到多实例。
#   - 若坚持 Free 实例：无法挂载磁盘，SQLite 数据在每次部署/重启后都会清空，只适合临时演示。
services:
  - type: web
    name: tangyuanmath
    runtime: node
    # 不设 rootDir：构建/启动命令自行 cd 进 server/（与线上一致，见文件头说明）
    buildCommand: cd server && pnpm install
    startCommand: cd server && node src/index.js
    healthCheckPath: /
    plan: starter            # 需要持久磁盘；若接受丢数据可改回 free 并删除下方 disk 块
    disk:
      name: tm-data
      mountPath: /data       # 与控制台磁盘挂载点一致
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production            # 启用 secure cookie、严格 CSP、静态缓存
      - key: TM_DB_FILE
        value: /data/app.db          # 必须位于上方 mountPath 之内，数据库才写到持久磁盘
      # 每日加密备份默认写到 /data/backups（与数据库同盘），保留 30 天，无需额外配置。
      # 建议在控制台设置 TM_BACKUP_KEY（备份口令，不要写进仓库）；未设置时会自动生成
      # /data/backups/backup.key。该密钥与备份同盘，异地副本时必须另行离线保存，
      # 否则磁盘损坏后备份无法解密。异地副本与恢复演练仍属运维待办（DESIGN 12.2）。
      - key: TM_MAIL_TRANSPORT
        value: cloudflare             # 走 Cloudflare Email Service 的 REST API（HTTPS 443，不经 SMTP）
      - key: TM_MAIL_FROM
        value: Tangyuan Math <no-reply@tangyuanmath.com>   # 发信域须在 Cloudflare 完成 Email Sending 接入
      # Cloudflare Email Service 凭据：sync: false 表示值在控制台填写，后续同步会保留控制台已有值。
      # API Token 需要「Email Sending: Edit」权限；账号 ID 见 Cloudflare 控制台概览页。
      - key: TM_CF_ACCOUNT_ID
        sync: false
      - key: TM_CF_API_TOKEN
        sync: false
      # 邮件里的验证/重置链接用这个基址拼出。必须是用户实际访问的域名：
      # 若填 onrender.com，用户点邮件链接后会在 onrender.com 上建立会话，
      # 回到 tangyuanmath.com 时看起来仍是未登录状态。
      # ⚠️ 改这里之前先在 Render 控制台把同名环境变量改成同样的值，否则下次 Blueprint 同步会以本文件为准覆盖控制台。
      - key: TM_PUBLIC_BASE_URL
        value: https://tangyuanmath.com
      # Google 登录（OAuth 2.0）。密钥不进仓库：sync: false 表示值在控制台填写，
      # 后续同步会保留控制台已有值。注意：首次创建 Blueprint 时 Render 会提示你输入这两项，
      # 请把控制台里已有的值粘贴进去，留空会导致 Google 登录失效。
      # 另需在 Google Cloud Console 的 OAuth 2.0 客户端里登记回调地址：
      #   https://tangyuanmath.com/api/auth/google/callback      （线上，回调地址由请求推导）
      #   http://127.0.0.1:3000/api/auth/google/callback        （本地开发用）
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Waffo Pancake 支付。Merchant/Store ID 是公开标识；私钥与商品 ID 只在控制台填写。
      # 2026-10-21 已在生产环境创建并发布三个商品（与定价页一致 $4.99/$49/$149），控制台需同步设置：
      #   WAFFO_PRODUCT_MONTHLY=PROD_71yskxGFcF5Q3cjpSw7dmT
      #   WAFFO_PRODUCT_YEARLY=PROD_4pqzHIrp1JloGbGQI4fqyt
      #   WAFFO_PRODUCT_LIFETIME=PROD_1hRroFAQXQiaA93WsqCDR1
      # 生产 webhook 已注册：https://tangyuanmath.com/api/payments/waffo/webhook（testMode=false）。
      - key: WAFFO_MERCHANT_ID
        value: MER_47pr6GX7NZmc45XV3Yatqs
      - key: WAFFO_STORE_ID
        value: STO_0XhVdBglSpSA3dEQi6gfwt
      - key: WAFFO_ENVIRONMENT
        value: prod
      - key: WAFFO_PRIVATE_KEY
        sync: false
      - key: WAFFO_PRODUCT_MONTHLY
        sync: false
      - key: WAFFO_PRODUCT_YEARLY
        sync: false
      - key: WAFFO_PRODUCT_LIFETIME
        sync: false
      # NODE_VERSION 故意不设：线上由 server/package.json 的 engines(>=22.5) 决定，当前解析为 Node 26.x。
      # 若要固定大版本，取消下面两行注释（注意：换大版本会触发 better-sqlite3 原生模块重新编译）。
      # - key: NODE_VERSION
      #   value: "22"
